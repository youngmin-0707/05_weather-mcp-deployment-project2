name: Frontend CI
on:
  push:
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example build
      - run: |
          docker network create weather-local
          docker compose --env-file .env.example up -d
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:8501/_stcore/health
          docker compose down
