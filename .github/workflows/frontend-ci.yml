name: Frontend CI
on:
  push:
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example build
      - run: |
          trap 'docker compose down' EXIT
          docker network create weather-local
          if ! docker compose --env-file .env.example up -d --wait --wait-timeout 120; then
            docker compose logs --tail=100
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health
