name: Frontend CI
on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml', '.github/scripts/deploy.sh']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml', '.github/scripts/deploy.sh']
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/test.txt
      - run: python -m py_compile src/app.py
      - run: cp config/.env.docker.example config/.env.docker
      - run: docker compose -f deploy/compose.yml config --quiet
      - run: docker compose -f deploy/compose.yml build
      - run: |
          trap 'docker compose -f deploy/compose.yml down' EXIT
          if ! docker compose -f deploy/compose.yml up -d --wait --wait-timeout 120; then
            docker compose -f deploy/compose.yml logs --tail=100
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: frontend
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to EC2
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: bash .github/scripts/deploy.sh frontend
