name: MCP server CI
on:
  push:
    paths: ['mcp_server/**', '.github/workflows/mcp-server-ci.yml']
  pull_request:
    paths: ['mcp_server/**', '.github/workflows/mcp-server-ci.yml']
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp_server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q server.py
      - run: python -m pytest -q
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example build
