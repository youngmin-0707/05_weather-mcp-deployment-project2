name: MCP server CI
on:
  push:
    branches: [main]
    paths: ['mcp_server/**', '.github/workflows/mcp-server-ci.yml', '.github/scripts/deploy.sh']
  pull_request:
    paths: ['mcp_server/**', '.github/workflows/mcp-server-ci.yml', '.github/scripts/deploy.sh']
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp_server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/test.txt
      - run: python -m py_compile src/server.py
      - run: python -m pytest tests -q
      - run: |
          cp config/.env.example config/.env
          cp config/.env.docker.example config/.env.docker
      - run: docker compose -f deploy/compose.yml config --quiet
      - run: docker compose -f deploy/compose.yml build

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: MCP
    concurrency:
      group: deploy-mcp
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to EC2
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: bash .github/scripts/deploy.sh mcp_server
