name: MCP server CI
on:
  push:
    paths: ['mcp_server/**', '.github/workflows/mcp-server-ci.yml']
  pull_request:
    paths: ['mcp_server/**', '.github/workflows/mcp-server-ci.yml']
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp_server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/test.txt
      - run: python -m py_compile src/server.py
      - run: python -m pytest tests -q
      - run: |
          cp config/.env.example config/.env
          cp config/.env.docker.example config/.env.docker
      - run: docker compose -f deploy/compose.yml config --quiet
      - run: docker compose -f deploy/compose.yml build
