name: weather-mcp

services:
  weather-mcp:
    build: .
    networks:
      - weather-local
    ports:
      - "127.0.0.1:8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  weather-local:
    external: true
    name: weather-local
