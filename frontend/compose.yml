name: weather-frontend

services:
  frontend:
    build: .
    networks:
      - weather-local
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  weather-local:
    external: true
    name: weather-local
